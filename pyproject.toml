[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reltrial"
version = "0.1.0"
description = "When does relational structure pay off? Graph models vs. strong baselines for clinical trial outcome prediction (CS224W project)."
authors = [{ name = "Manel Bermad", email = "mbermad@stanford.edu" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "relbench==3.1.0",
  "lightgbm>=4.3",
  "scikit-learn>=1.3",
  "scipy",
  "pandas>=2.0",
  "numpy",
  "matplotlib",
]

[project.optional-dependencies]
gnn = [
  "torch>=2.4",
  "torch_geometric>=2.6",
  "pytorch_frame[full]>=0.2.5",
  "sentence-transformers",
]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
